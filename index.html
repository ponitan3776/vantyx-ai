<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WebLLM Pair</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs/loader.js"></script>
<style>
  html, body { height: 100%; margin: 0; }
  #editor { height: 100%; }
</style>
</head>
<body class="bg-neutral-950 text-neutral-100">

<div id="loading" class="h-screen flex flex-col items-center justify-center gap-4 p-8 text-center">
  <h1 class="text-2xl font-bold">WebLLM Pair</h1>
  <p id="progress" class="text-neutral-400 max-w-md">機種を確認中…</p>
  <p id="profile" class="text-xs text-neutral-500"></p>
</div>

<div id="app" class="hidden h-screen flex-col">
  <header class="flex items-center justify-between px-3 py-2 border-b border-neutral-800">
    <div class="text-sm font-bold">WebLLM Pair</div>
    <div class="flex gap-2 md:hidden" id="tabs">
      <button data-tab="chat"    class="tab-btn text-xs px-2 py-1 rounded bg-blue-600">チャット</button>
      <button data-tab="code"    class="tab-btn text-xs px-2 py-1 rounded bg-neutral-800">コード</button>
      <button data-tab="preview" class="tab-btn text-xs px-2 py-1 rounded bg-neutral-800">プレビュー</button>
    </div>
    <button id="zipBtn" class="text-xs px-2 py-1 rounded bg-neutral-800">ZIP保存</button>
  </header>

  <div class="flex-1 grid md:grid-cols-[280px_1fr_1fr] overflow-hidden">
    <aside id="leftPane" class="flex flex-col border-r border-neutral-800 overflow-hidden min-h-0">
      <div class="p-2 text-sm border-b border-neutral-800">
        <div class="flex justify-between items-center mb-2">
          <span class="font-bold">Files</span>
          <button id="addFileBtn" class="text-xs border px-2 py-1 rounded">+</button>
        </div>
        <ul id="fileList" class="space-y-1"></ul>
      </div>
      <div class="flex-1 min-h-0 flex flex-col">
        <div id="chatLog" class="flex-1 overflow-auto p-2 space-y-2 text-sm"></div>
        <div class="p-2 flex gap-2 border-t border-neutral-800">
          <input id="chatInput" class="flex-1 bg-neutral-900 border border-neutral-700 rounded px-2 py-1 text-sm" placeholder="作りたいもの・直したいことを書く" />
          <button id="sendBtn" class="px-3 py-1 rounded bg-blue-600 text-white text-sm">送信</button>
        </div>
      </div>
    </aside>

    <section id="editorPane" class="hidden md:block min-h-0 bg-neutral-900">
      <div id="editor" style="height:100%"></div>
    </section>

    <section id="previewPane" class="hidden md:block min-h-0 border-l border-neutral-800 bg-white">
      <iframe id="previewFrame" class="w-full h-full" sandbox="allow-scripts allow-modals allow-downloads"></iframe>
    </section>
  </div>
</div>

<script>
  window.monacoReady = new Promise((resolve) => {
    require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs' } });
    require(['vs/editor/editor.main'], () => resolve(window.monaco));
  });
</script>

<script type="module">
// ── 静的importを使わない（ブロックの原因になる）──
let webllm = null;

const MODELS = {
  light:    "Qwen2.5-0.5B-Instruct-q4f16_1-MLC",
  standard: "Qwen2.5-Coder-1.5B-Instruct-q4f16_1-MLC",
  heavy:    "Phi-3.5-mini-instruct-q4f16_1-MLC",
};

// ── システムプロンプト（< を一切使わないマーカー）──
const SYSTEM_PROMPT = `あなたはコード編集アシスタントです。以下の形式だけを使います。

# ルール1: まず質問する
依頼が曖昧・情報不足なら、編集せずに1〜3個の質問だけを出します。
[QUESTION]
質問内容
[/QUESTION]

# ルール2: 部分編集のみ（全体を書き直さない）
既存行の置き換え:
@@EDIT:ファイル名@@
###SEARCH###
既存と完全一致する変更前のコード
###REPLACE###
変更後のコード
###END###

既存行の直後に追加:
@@ADD:ファイル名@@
###AFTER###
挿入位置の直前の既存コード
###CONTENT###
追加するコード
###END###

新規ファイル作成:
@@CREATE:ファイル名@@
###CONTENT###
ファイル内容
###END###

# ルール3
- マーカー外にコードを書かない
- 説明文は日本語で短く
- SEARCH / AFTER は既存コードから一字一句コピーする
- 既存ファイルは index.html, style.css, script.js の3つ
- 新しいファイルを作る場合は index.html からの参照も @@EDIT@@ で追加する
- エラー修正時は原因を1行述べてから @@EDIT@@ を出す`;

// ── 状態 ──
let engine = null, modelId = null, chatHistory = [];
let currentFS = {
  "index.html": `<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>My App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Hello</h1>
  <script src="script.js"><\/script>
</body>
</html>`,
  "style.css": `body { font-family: system-ui; padding: 24px; }`,
  "script.js": `console.log("ready");`,
};
let selected = "index.html", editor = null, busy = false;

// ── 機種判定 ──
async function detectDeviceProfile() {
  const ua = navigator.userAgent;
  const isIOS = /iPad|iPhone|iPod/.test(ua) ||
    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const isMobile = /Android|iPhone|iPad|iPod/i.test(ua);

  if (!("gpu" in navigator) || !navigator.gpu) {
    return { webgpu: false, isIOS, isMobile, maxBufferSize: 0,
      recommendedTier: "light", reason: "WebGPU非対応。軽量モデルのみ使用します。" };
  }
  let adapter = null;
  try { adapter = await navigator.gpu.requestAdapter({ powerPreference: "high-performance" }); }
  catch { adapter = null; }
  if (!adapter) {
    return { webgpu: false, isIOS, isMobile, maxBufferSize: 0,
      recommendedTier: "light", reason: "WebGPUアダプタ取得失敗。軽量モデルのみ使用します。" };
  }
  const maxBufferSize = adapter.limits.maxBufferSize;
  if (isIOS) {
    return { webgpu: true, isIOS, isMobile, maxBufferSize,
      recommendedTier: "light", reason: "iOSはメモリ上限が厳しいため軽量モデル固定です。" };
  }
  if (maxBufferSize >= 2 * 1024 * 1024 * 1024) {
    return { webgpu: true, isIOS, isMobile, maxBufferSize,
      recommendedTier: "heavy", reason: "十分なGPUバッファがあります。" };
  }
  return { webgpu: true, isIOS, isMobile, maxBufferSize,
    recommendedTier: "standard", reason: "標準的なGPUバッファです。" };
}

// ── 出力パーサー（@@ と ### マーカー）──
function parseAIOutput(text) {
  const edits = [], questions = [];
  let m;
  const qRe = /\[QUESTION\]\s*([\s\S]*?)\s*\[\/QUESTION\]/g;
  while ((m = qRe.exec(text))) questions.push(m[1].trim());
  const eRe = /@@EDIT:([^@]+)@@\s*###SEARCH###\s*([\s\S]*?)\s*###REPLACE###\s*([\s\S]*?)\s*###END###/g;
  while ((m = eRe.exec(text))) edits.push({ kind: "replace", file: m[1].trim(), search: m[2].trim(), replace: m[3].trim() });
  const aRe = /@@ADD:([^@]+)@@\s*###AFTER###\s*([\s\S]*?)\s*###CONTENT###\s*([\s\S]*?)\s*###END###/g;
  while ((m = aRe.exec(text))) edits.push({ kind: "add", file: m[1].trim(), after: m[2].trim(), content: m[3].trim() });
  const cRe = /@@CREATE:([^@]+)@@\s*###CONTENT###\s*([\s\S]*?)\s*###END###/g;
  while ((m = cRe.exec(text))) edits.push({ kind: "create", file: m[1].trim(), content: m[2].trim() });
  const explanation = text
    .replace(/\[QUESTION\][\s\S]*?\[\/QUESTION\]/g, "")
    .replace(/@@EDIT:[^@]+@@[\s\S]*?###END###/g, "")
    .replace(/@@ADD:[^@]+@@[\s\S]*?###END###/g, "")
    .replace(/@@CREATE:[^@]+@@[\s\S]*?###END###/g, "")
    .trim();
  return { edits, questions, explanation };
}

// ── 編集適用 ──
function applyEdits(fs, edits) {
  const next = { ...fs };
  const errors = [];
  for (const e of edits) {
    if (e.kind === "create") {
      if (next[e.file] !== undefined) { errors.push(`"${e.file}" は既に存在します`); continue; }
      next[e.file] = e.content; continue;
    }
    const content = next[e.file];
    if (content === undefined) { errors.push(`ファイル "${e.file}" がありません`); continue; }
    if (e.kind === "replace") {
      const i = content.indexOf(e.search);
      if (i === -1) { errors.push(`"${e.file}" に SEARCH が見つかりません`); continue; }
      next[e.file] = content.slice(0, i) + e.replace + content.slice(i + e.search.length);
    } else {
      const i = content.indexOf(e.after);
      if (i === -1) { errors.push(`"${e.file}" に AFTER が見つかりません`); continue; }
      const at = i + e.after.length;
      next[e.file] = content.slice(0, at) + "\n" + e.content + content.slice(at);
    }
  }
  return { fs: next, errors };
}

// ── DOM参照 ──
const $ = (id) => document.getElementById(id);
const loadingEl = $("loading"), appEl = $("app");
const progressEl = $("progress"), profileEl = $("profile");
const chatLogEl = $("chatLog"), chatInputEl = $("chatInput"), sendBtnEl = $("sendBtn");
const fileListEl = $("fileList"), addFileBtnEl = $("addFileBtn");
const zipBtnEl = $("zipBtn"), previewFrameEl = $("previewFrame");

// ── チャット表示 ──
function pushLog(role, content) {
  const div = document.createElement("div");
  div.className = role === "user" ? "text-right" : "";
  const span = document.createElement("span");
  span.className = `inline-block px-2 py-1 rounded whitespace-pre-wrap ${
    role === "user" ? "bg-blue-600 text-white" : "bg-neutral-800"}`;
  span.textContent = content;
  div.appendChild(span);
  chatLogEl.appendChild(div);
  chatLogEl.scrollTop = chatLogEl.scrollHeight;
}

// ── ファイル一覧 ──
function renderFileList() {
  fileListEl.innerHTML = "";
  for (const f of Object.keys(currentFS)) {
    const li = document.createElement("li");
    const btn = document.createElement("button");
    btn.className = `w-full text-left px-2 py-1 rounded ${
      f === selected ? "bg-blue-600 text-white" : "hover:bg-neutral-800"}`;
    btn.textContent = f;
    btn.onclick = () => selectFile(f);
    li.appendChild(btn);
    fileListEl.appendChild(li);
  }
}

function selectFile(f) {
  if (editor) currentFS[selected] = editor.getValue();
  selected = f;
  if (editor) {
    const lang = f.endsWith(".html") ? "html" : f.endsWith(".css") ? "css"
      : f.endsWith(".js") ? "javascript" : "plaintext";
    window.monaco.editor.setModelLanguage(editor.getModel(), lang);
    editor.setValue(currentFS[f] ?? "");
  }
  renderFileList();
  updatePreview();
}

function updatePreview() {
  if (editor) currentFS[selected] = editor.getValue();
  const html = currentFS["index.html"] ?? "";
  const css = currentFS["style.css"] ?? "";
  const js = currentFS["script.js"] ?? "";
  previewFrameEl.srcdoc =
    `<!doctype html><html><head><meta charset="utf-8"><style>${css}</style></head>` +
    `<body>${html}<script>${js}<\/script></body></html>`;
}

// ── モバイルタブ ──
document.querySelectorAll(".tab-btn").forEach((btn) => {
  btn.onclick = () => {
    const tab = btn.dataset.tab;
    $("leftPane").classList.toggle("hidden", tab !== "chat");
    $("editorPane").classList.toggle("hidden", tab !== "code");
    $("previewPane").classList.toggle("hidden", tab !== "preview");
    document.querySelectorAll(".tab-btn").forEach((b) => {
      const active = b.dataset.tab === tab;
      b.classList.toggle("bg-blue-600", active);
      b.classList.toggle("bg-neutral-800", !active);
    });
  };
});

// ── 送信 ──
async function sendMessage() {
  if (!chatInputEl.value.trim() || busy || !engine) return;
  const msg = chatInputEl.value.trim();
  chatInputEl.value = "";
  busy = true; sendBtnEl.disabled = true;
  pushLog("user", msg);
  try {
    if (editor) currentFS[selected] = editor.getValue();
    const fsDump = Object.entries(currentFS).map(([n, c]) => `--- ${n} ---\n${c}`).join("\n\n");
    const messages = [
      { role: "system", content: SYSTEM_PROMPT },
      { role: "user", content: `現在のファイル:\n${fsDump}` },
      ...chatHistory,
      { role: "user", content: msg },
    ];
    const stream = await engine.chat.completions.create({
      messages, stream: true, temperature: 0.1, max_tokens: 1024,
    });
    let acc = "";
    for await (const chunk of stream) acc += chunk.choices[0]?.delta?.content || "";
    chatHistory.push({ role: "user", content: msg });
    chatHistory.push({ role: "assistant", content: acc });
    const { edits, questions, explanation } = parseAIOutput(acc);
    if (questions.length > 0) {
      pushLog("assistant", (explanation ? explanation + "\n\n" : "") +
        questions.map((q) => "・" + q).join("\n"));
      return;
    }
    if (edits.length > 0) {
      const { fs: next, errors } = applyEdits(currentFS, edits);
      currentFS = next;
      if (!currentFS[selected]) selected = Object.keys(currentFS)[0];
      renderFileList();
      if (editor) {
        const lang = selected.endsWith(".html") ? "html" : selected.endsWith(".css") ? "css"
          : selected.endsWith(".js") ? "javascript" : "plaintext";
        window.monaco.editor.setModelLanguage(editor.getModel(), lang);
        editor.setValue(currentFS[selected] ?? "");
      }
      updatePreview();
      pushLog("assistant", (explanation || "修正しました。") +
        (errors.length ? "\n\n⚠️ " + errors.join("\n⚠️ ") : ""));
    } else {
      pushLog("assistant", explanation || "…");
    }
  } catch (err) {
    pushLog("assistant", "エラー: " + String(err));
  } finally {
    busy = false; sendBtnEl.disabled = false;
  }
}
sendBtnEl.onclick = sendMessage;
chatInputEl.addEventListener("keydown", (e) => { if (e.key === "Enter") sendMessage(); });

// ── ファイル追加 ──
addFileBtnEl.onclick = () => {
  const name = prompt("新しいファイル名（例: about.html）");
  if (!name) return;
  if (currentFS[name] !== undefined) return alert("既に存在します");
  currentFS[name] = "";
  selectFile(name);
};

// ── ZIP保存 ──
zipBtnEl.onclick = async () => {
  if (editor) currentFS[selected] = editor.getValue();
  const zip = new JSZip();
  for (const [f, c] of Object.entries(currentFS)) zip.file(f, c);
  const blob = await zip.generateAsync({ type: "blob" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "my-project.zip";
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
};

// ── 裏DL ──
function preloadModel(id) {
  if (id === modelId) return;
  const code = `
    import { CreateMLCEngine, prebuiltAppConfig } from "https://esm.run/@mlc-ai/web-llm";
    self.onmessage = async (e) => {
      try {
        const engine = await CreateMLCEngine(e.data.modelId, {
          appConfig: { ...prebuiltAppConfig, cacheBackend: "opfs" },
        });
        await engine.unload();
        self.postMessage({ type: "done" });
      } catch (err) { self.postMessage({ type: "error", error: String(err) }); }
    };
  `;
  const blob = new Blob([code], { type: "text/javascript" });
  const worker = new Worker(URL.createObjectURL(blob), { type: "module" });
  worker.postMessage({ modelId: id });
  worker.onmessage = () => worker.terminate();
}

// ── 起動（段階ログ付き）──
async function boot() {
  try {
    console.log("[1] boot start");
    progressEl.textContent = "機種を確認中…";
    const profile = await detectDeviceProfile();
    console.log("[2] profile", profile);
    profileEl.textContent =
      `判定: ${profile.recommendedTier} / WebGPU: ${profile.webgpu} / iOS: ${profile.isIOS} / ${profile.reason}`;

    progressEl.textContent = `${profile.reason} WebLLMを読み込み中…`;
    try {
      webllm = await import("https://esm.run/@mlc-ai/web-llm");
      console.log("[3] webllm loaded");
    } catch (e) {
      progressEl.textContent = "WebLLMの読み込みに失敗: " + e.message + "（HTTPSで開いていますか？）";
      console.error(e);
      return;
    }

    progressEl.textContent = `${profile.reason} モデル読み込み中…`;
    const startModel = profile.recommendedTier === "light" ? MODELS.light : MODELS.standard;
    engine = await webllm.CreateMLCEngine(startModel, {
      appConfig: { ...webllm.prebuiltAppConfig, cacheBackend: "opfs" },
      initProgressCallback: (p) => { progressEl.textContent = p.text; },
    });
    modelId = startModel;
    console.log("[4] engine ready");

    // Monacoが準備できなくても落ちないように
    let monaco = null;
    try {
      monaco = await Promise.race([
        window.monacoReady,
        new Promise((r) => setTimeout(() => r(null), 5000)),
      ]);
    } catch { monaco = null; }

    if (monaco) {
      editor = monaco.editor.create($("editor"), {
        value: currentFS[selected], language: "html", theme: "vs-dark",
        minimap: { enabled: false }, fontSize: 13, automaticLayout: true,
      });
      editor.onDidChangeModelContent(() => {
        currentFS[selected] = editor.getValue();
        updatePreview();
      });
    } else {
      $("editorPane").innerHTML =
        '<div class="p-4 text-sm text-red-400">エディタの読み込みに失敗しました（Monaco CDN）。</div>';
    }

    loadingEl.classList.add("hidden");
    appEl.classList.remove("hidden");
    appEl.classList.add("flex");

    renderFileList();
    updatePreview();
    pushLog("assistant", "何を作りたいか教えてください。まずは質問しながら進めます。");
    console.log("[5] done");

    if (!profile.isIOS) {
      const bg = profile.recommendedTier === "heavy" ? MODELS.heavy : MODELS.standard;
      if (bg !== startModel) preloadModel(bg);
    }
  } catch (err) {
    console.error(err);
    progressEl.textContent = "初期化に失敗: " + (err?.message || String(err));
  }
}

boot();
</script>
</body>
</html>
