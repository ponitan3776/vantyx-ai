<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>AI ゲーム工房 - 初心者向けローカルAIスタジオ</title>
  <style>
    :root {
      --bg-base: #090d16;
      --bg-panel: #111827;
      --bg-card: #1f2937;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.3);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border: #334155;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg-base); color: var(--text-main);
      display: flex; height: 100vh; overflow: hidden;
    }

    /* 🌟 リッチなロード画面（オーバーレイ） */
    #loading-overlay {
      position: fixed; inset: 0; background: rgba(9, 13, 22, 0.95);
      backdrop-filter: blur(10px); z-index: 9999; display: flex;
      flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 0.5s ease;
    }
    .loader-card {
      background: var(--bg-panel); border: 1px solid var(--border);
      padding: 40px; border-radius: 20px; text-align: center; width: 400px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    .spinner {
      width: 50px; height: 50px; border: 4px solid var(--border);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin 1s linear infinite; margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .progress-bar-container {
      width: 100%; background: var(--bg-card); height: 8px; border-radius: 4px;
      overflow: hidden; margin-top: 15px; border: 1px solid var(--border);
    }
    .progress-bar {
      width: 0%; height: 100%; background: linear-gradient(90deg, #38bdf8, #818cf8);
      transition: width 0.3s ease;
    }
    #load-status { font-size: 0.85rem; color: var(--text-sub); margin-top: 10px; line-height: 1.4; }

    /* 左側：チャットパネル */
    .chat-panel {
      width: 450px; background: var(--bg-panel); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; box-shadow: 10px 0 30px rgba(0,0,0,0.4);
    }
    .chat-header {
      padding: 16px 20px; background: var(--bg-base); border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
    }
    .chat-header h1 { margin: 0; font-size: 1.1rem; color: var(--accent); display: flex; align-items: center; gap: 8px; }
    
    #chat-box {
      flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px;
    }
    .msg {
      padding: 14px 18px; border-radius: 14px; font-size: 0.92rem; line-height: 1.6;
      max-width: 90%; white-space: pre-wrap; word-break: break-word;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .msg.user { background: #0284c7; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3); }
    .msg.ai { background: var(--bg-card); color: var(--text-main); align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid var(--border); }

    /* 予想時間＆ステータス表示 */
    .timer-badge {
      font-size: 0.78rem; color: #fbbf24; background: rgba(251, 191, 36, 0.1);
      border: 1px solid rgba(251, 191, 36, 0.3); padding: 4px 10px; border-radius: 20px;
      display: inline-block; margin-bottom: 8px;
    }

    /* クイックチップ */
    .quick-actions { padding: 8px 20px 0; display: flex; gap: 8px; flex-wrap: wrap; }
    .chip-btn {
      background: var(--bg-card); color: var(--accent); border: 1px solid var(--border); border-radius: 20px;
      padding: 6px 14px; font-size: 0.8rem; cursor: pointer; transition: all 0.2s;
    }
    .chip-btn:hover { background: var(--accent); color: var(--bg-base); border-color: var(--accent); }

    .input-area {
      padding: 16px 20px 20px; background: var(--bg-base); border-top: 1px solid var(--border); display: flex; gap: 10px;
    }
    textarea {
      flex: 1; height: 54px; background: var(--bg-card); color: #fff; border: 1px solid var(--border);
      border-radius: 10px; padding: 12px; resize: none; font-family: inherit; font-size: 0.9rem; outline: none;
      transition: border-color 0.2s;
    }
    textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-glow); }
    button#send-btn {
      padding: 0 20px; background: var(--accent); color: var(--bg-base); border: none; border-radius: 10px;
      font-weight: bold; cursor: pointer; transition: transform 0.1s, background 0.2s;
    }
    button#send-btn:hover { background: #0ea5e9; transform: translateY(-1px); }
    button#send-btn:active { transform: translateY(0); }
    button#send-btn:disabled { background: var(--border); color: var(--text-sub); cursor: not-allowed; transform: none; }

    .reset-btn {
      background: var(--bg-card); color: var(--text-sub); border: 1px solid var(--border); border-radius: 6px; padding: 5px 12px; font-size: 0.78rem; cursor: pointer; transition: 0.2s;
    }
    .reset-btn:hover { color: #fff; border-color: var(--text-sub); }

    /* 右側：プレイプレビューパネル */
    .preview-panel {
      flex: 1; display: flex; flex-direction: column; background: var(--bg-base);
    }
    .preview-header {
      padding: 12px 24px; background: var(--bg-panel); border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem;
    }
    .preview-actions { display: flex; gap: 8px; }
    .action-btn {
      background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border);
      padding: 6px 14px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; font-weight: 500;
      display: flex; align-items: center; gap: 6px; transition: 0.2s;
    }
    .action-btn:hover { background: #374151; border-color: var(--accent); color: var(--accent); }
    
    #game-frame {
      flex: 1; width: 100%; height: 100%; border: none; background: #fff;
    }
  </style>
</head>
<body>

  <!-- 🌟 初回ロード画面（段階的・アニメーション付き） -->
  <div id="loading-overlay">
    <div class="loader-card">
      <div class="spinner"></div>
      <h3 style="margin:0 0 8px 0; color:var(--accent);">AIシステムを起動中</h3>
      <p style="margin:0; font-size:0.85rem; color:var(--text-sub);">安全なオフライン環境を構築しています...</p>
      <div class="progress-bar-container">
        <div id="progress-bar" class="progress-bar"></div>
      </div>
      <div id="load-status">モデルをロード中 (初回のみダウンロードが発生します)</div>
    </div>
  </div>

  <!-- 左側：おしゃべりエリア -->
  <div class="chat-panel">
    <div class="chat-header">
      <div>
        <h1>🎨 AI ゲーム工房</h1>
      </div>
      <button class="reset-btn" id="reset-btn">最初から話す</button>
    </div>

    <div id="chat-box">
      <div class="msg ai">こんにちは！どんなゲームやオモチャを作りたいですか？<br><br>まずは気軽にイメージを教えてね！いくつか質問しながら一緒に形を決めていこう。</div>
    </div>

    <div class="quick-actions">
      <button class="chip-btn" onclick="quickSend('おまかせでいいよ！作って！')">✨ おまかせで作って！</button>
      <button class="chip-btn" onclick="quickSend('はい、その内容でお願いします！')">👍 それでOK！作って</button>
      <button class="chip-btn" onclick="quickSend('もっと派手な演出にして！')">🎨 もっと派手にして</button>
    </div>

    <div class="input-area">
      <textarea id="prompt" placeholder="例：ブロック崩しゲームを作りたい！"></textarea>
      <button id="send-btn" disabled>送信</button>
    </div>
  </div>

  <!-- 右側：遊ぶエリア -->
  <div class="preview-panel">
    <div class="preview-header">
      <span id="app-title" style="color:var(--accent); font-weight:bold;">🎮 プレビュー待機中</span>
      <div class="preview-actions">
        <button class="action-btn" onclick="copyCode()">📋 コードをコピー</button>
        <button class="action-btn" onclick="downloadFile()">💾 HTMLを保存</button>
      </div>
    </div>
    <iframe id="game-frame"></iframe>
  </div>

  <script type="module">
    import * as webllm from "https://esm.run/@mlc-ai/web-llm";

    // iOSや環境負荷を考慮し、軽量かつコーディング性能の高い1.5Bモデルを採用
    const MODEL_ID = "Qwen2.5-Coder-1.5B-Instruct-q4f16_1-MLC";
    let engine;

    let currentCode = `<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #0f172a; color: #94a3b8; }
    h2 { color: #38bdf8; margin-bottom: 8px; }
  </style>
</head>
<body>
  <h2>🎨 ここに作ったゲームが表示されるよ</h2>
  <p>左側のチャットでどんなものを作りたいか話しかけてね！</p>
</body>
</html>`;

    const frame = document.getElementById('game-frame');
    frame.srcdoc = currentCode;

    const overlay = document.getElementById('loading-overlay');
    const progressBar = document.getElementById('progress-bar');
    const loadStatus = document.getElementById('load-status');
    const sendBtn = document.getElementById('send-btn');
    const chatBox = document.getElementById('chat-box');
    const promptInput = document.getElementById('prompt');

    const SYSTEM_PROMPT = `あなたは初心者向けの優しいゲーム・アプリ制作パートナーAIです。
ユーザーはプログラミングの知識がありません。専門用語は使わず、親しみやすい日本語で話してください。

【重要な行動ルール】
1. ユーザーから「〇〇を作りたい」と言われた時は、いきなりコードを書かず、まずはイメージを膨らませるための簡単な質問を2〜3個優しく投げかけてください。
2. ユーザーが「OK」「おまかせ」と言ったら、制作フェーズに入ります。
3. 制作フェーズでは、HTML、CSS、JavaScriptをすべて1つにまとめた完全なHTMLコードを \`\`\`html 〜 \`\`\` の形式で出力してください。`;

    let chatHistory = [{ role: "system", content: SYSTEM_PROMPT }];

    // WebLLMの初期化（段階的な進捗をリッチに表示）
    async function init() {
      try {
        if (!navigator.gpu) {
          loadStatus.textContent = "エラー: WebGPU非対応の環境です。最新のChromeまたはEdgeをお使いください。";
          return;
        }

        engine = await webllm.CreateMLCEngine(MODEL_ID, {
          initProgressCallback: (report) => {
            loadStatus.textContent = report.text;
            // 進捗テキストからパーセンテージや数値をざっくり推測してバーに反映
            if (report.text.includes("%")) {
              const match = report.text.match(/(\d+)%/);
              if (match && match[1]) {
                progressBar.style.width = match[1] + "%";
              }
            } else {
              // 段階的にバーを進めるアニメーション演出
              const currentWidth = parseFloat(progressBar.style.width) || 10;
              if (currentWidth < 90) {
                progressBar.style.width = (currentWidth + 15) + "%";
              }
            }
          }
        });

        // ロード完了！
        progressBar.style.width = "100%";
        loadStatus.textContent = "準備完了！";
        setTimeout(() => {
          overlay.style.opacity = '0';
          setTimeout(() => overlay.remove(), 500); // 画面から消す
          sendBtn.disabled = false;
        }, 400);

      } catch (err) {
        loadStatus.textContent = `初期化エラー: ${err.message}`;
      }
    }

    window.quickSend = function(text) {
      if (sendBtn.disabled) return;
      promptInput.value = text;
      sendMessage();
    };

    document.getElementById('reset-btn').addEventListener('click', () => {
      chatHistory = [{ role: "system", content: SYSTEM_PROMPT }];
      chatBox.innerHTML = `<div class="msg ai">会話をリセットしたよ！次はどんなものを作ろうか？</div>`;
    });

    // 📋 コードコピー機能
    window.copyCode = function() {
      navigator.clipboard.writeText(currentCode).then(() => {
        alert("プレビューのコードをクリップボードにコピーしました！");
      });
    };

    // 💾 ファイル保存機能
    window.downloadFile = function() {
      const blob = new Blob([currentCode], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'my_ai_game.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    };

    async function sendMessage() {
      const text = promptInput.value.trim();
      if (!text || !engine) return;

      promptInput.value = "";
      sendBtn.disabled = true;

      // ユーザーメッセージ表示
      const userDiv = document.createElement('div');
      userDiv.className = "msg user";
      userDiv.textContent = text;
      chatBox.appendChild(userDiv);
      chatBox.scrollTop = chatBox.scrollHeight;

      chatHistory.push({ role: "user", content: text + `\n\n(現在のコード)\n\`\`\`html\n${currentCode}\n\`\`\`` });

      const messagesToSend = [chatHistory[0], ...chatHistory.slice(-8)];

      const aiDiv = document.createElement('div');
      aiDiv.className = "msg ai";
      aiDiv.innerHTML = `<div class="timer-badge">⏳ 予想完了時間: 約 5〜10 秒</div><div class="ai-text">AIが考えています...</div>`;
      chatBox.appendChild(aiDiv);
      chatBox.scrollTop = chatBox.scrollHeight;

      const aiTextEl = aiDiv.querySelector('.ai-text');

      try {
        const startTime = Date.now();
        const chunks = await engine.chat.completions.create({
          messages: messagesToSend,
          temperature: 0.6,
          stream: true,
        });

        let fullReply = "";
        for await (const chunk of chunks) {
          fullReply += chunk.choices[0]?.delta?.content || "";
          if (fullReply.includes("```")) {
            aiTextEl.textContent = "🔨 アプリを組み立て中...";
          } else {
            aiTextEl.textContent = fullReply;
          }
          chatBox.scrollTop = chatBox.scrollHeight;
        }

        chatHistory.push({ role: "assistant", content: fullReply });

        // コード抽出＆プレビュー自動更新
        const match = fullReply.match(/```(?:html)?([\s\S]*?)```/);
        if (match && match[1]) {
          currentCode = match[1].trim();
          frame.srcdoc = currentCode;
          document.getElementById('app-title').textContent = "🎮 プレイ可能！";
          aiTextEl.textContent = "🎉 完成したよ！右側のプレビュー画面で遊んでみてね。コードの保存やコピーも上部からできるよ！";
        } else {
          aiTextEl.textContent = fullReply;
        }

      } catch (err) {
        aiTextEl.textContent = `エラーが発生しました: ${err.message}`;
      } finally {
        sendBtn.disabled = false;
        chatBox.scrollTop = chatBox.scrollHeight;
      }
    }

    sendBtn.addEventListener('click', sendMessage);
    promptInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
        sendMessage();
      }
    });

    init();
  </script>
</body>
</html>
